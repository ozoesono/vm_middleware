jira:
  # Enable only after validate, preview and check succeed for your pilot teams.
  enabled: false
  batch_size: 100
  refresh_seconds: 3600
  retry_base_seconds: 60
  max_attempts: 5

  instances:
    shared:
      deployment: cloud
      base_url: https://org.atlassian.net
      auth:
        type: basic
        email_env: JIRA_USER_EMAIL
        token_env: JIRA_API_TOKEN
